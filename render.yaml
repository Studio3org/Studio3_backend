services:
  - type: web
    name: studio3-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    # -k gevent -w 1: Socket.IO (chat real-time) requires an async-capable worker; gevent
    # handles many concurrent long-lived connections on a single worker via greenlets, so this
    # replaces the previous default sync worker rather than adding a second process type.
    startCommand: "alembic upgrade head && gunicorn -k gevent -w 1 wsgi:app --bind 0.0.0.0:$PORT"
    # Liveness, not readiness: / touches nothing external, so a database blip cannot put the
    # service into a restart loop. Point an uptime monitor at /health for the real checks.
    healthCheckPath: /
    envVars:
      # This Render service is a test environment, not production. It behaves like
      # production for anything security-shaped, but does not require the Stripe
      # credentials — see src/shared/config/settings.py. It does need its own S3 bucket:
      # the local media fallback is development-only.
      - key: FLASK_ENV
        value: staging
      - key: DATABASE_URL
        sync: false # paste your existing Aiven Postgres connection string here
      - key: REDIS_URL
        sync: false # paste the Internal Redis URL from your existing studio3-redis instance (Render dashboard → that instance → Connect)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY_MINUTES
        value: "15"
      - key: SALT_ROUNDS
        value: "10"
      - key: FRONTEND_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: SES_FROM_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Payments. Without STRIPE_WEBHOOK_SECRET every webhook fails signature verification,
      # Stripe retries then gives up, and paid orders are never marked paid — so the app
      # refuses to boot without it rather than serving a silently broken checkout.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # comma-separated: platform endpoint secret, Connect endpoint secret
      - key: PLATFORM_CURRENCY
        value: usd
      - key: PLATFORM_COMMISSION_BPS
        value: "1000" # 10% — awaiting the client's tiered rates (20/15/8)
      - key: CONNECT_ACCOUNT_COUNTRY
        value: US
      - key: CONNECT_ONBOARDING_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      # Dead links in the share interstitial until the apps are published.
      - key: APP_STORE_URL
        sync: false
      - key: PLAY_STORE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false # unset = Sentry is not initialised at all
      # Proxies in front of the app (Render's router): the client IP is read from that many
      # X-Forwarded-For entries.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # --- Tickets, wallets, auctions, shipping (Phases 3 to 8) --------------------------
      # Keep these identical on the web service and the jobs worker: the worker sends ticket
      # emails and wallet updates, settles auctions and books couriers.
      - key: TICKET_SIGNING_KEY
        sync: false # base64 32 bytes (openssl rand -base64 32); never change once tickets exist
      - key: PLATFORM_TICKET_COMMISSION_BPS
        value: "800"
      - key: SALES_TAX_RATE_BPS
        value: "825"
      - key: SALES_TAX_PROVIDER
        value: flat # "stripe" once the accountant agrees and Stripe Tax is switched on
      - key: EVENT_PAYOUT_DELAY_HOURS
        value: "24"
      - key: AUCTION_PAYMENT_FIX_HOURS
        value: "12"
      - key: AUCTION_SECOND_CHANCE_HOURS
        value: "24"
      - key: GOOGLE_WALLET_ISSUER_ID
        sync: false
      - key: GOOGLE_WALLET_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APPLE_PASS_TYPE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_PASS_CERT_P12
        sync: false
      - key: APPLE_PASS_CERT_PASSWORD
        sync: false
      - key: APPLE_WWDR_CERT
        sync: false
      # Convelio shipping. Off until the app with the new checkout ships; the sandbox
      # (sk_test_) key is right for staging.
      - key: CONVELIO_ENABLED
        value: "false"
      - key: CONVELIO_API_KEY
        sync: false
      - key: SHIPPING_QUOTE_VALID_HOURS
        value: "24"
      - key: SHIPPING_INSURANCE_DEFAULT
        value: "true"
      - key: ORDER_AUTO_COMPLETE_DAYS
        value: "7"

  # Scheduled work runs here, not in the web process. Two services on purpose: the worker
  # can scale out, beat cannot — a second beat means every schedule fires twice.
  - type: worker
    name: studio3-jobs
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A src.jobs.celery_app.celery_app worker --loglevel=info --concurrency=2"
    envVars:
      - key: FLASK_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_CURRENCY
        value: usd
      - key: PLATFORM_COMMISSION_BPS
        value: "2000"
      - key: SENTRY_DSN
        sync: false
      - key: BACKEND_URL
        sync: false # the public URL: wallet links in ticket emails are built here
      # --- Tickets, wallets, auctions, shipping (Phases 3 to 8) --------------------------
      # Keep these identical on the web service and the jobs worker: the worker sends ticket
      # emails and wallet updates, settles auctions and books couriers.
      - key: TICKET_SIGNING_KEY
        sync: false # base64 32 bytes (openssl rand -base64 32); never change once tickets exist
      - key: PLATFORM_TICKET_COMMISSION_BPS
        value: "800"
      - key: SALES_TAX_RATE_BPS
        value: "825"
      - key: SALES_TAX_PROVIDER
        value: flat # "stripe" once the accountant agrees and Stripe Tax is switched on
      - key: EVENT_PAYOUT_DELAY_HOURS
        value: "24"
      - key: AUCTION_PAYMENT_FIX_HOURS
        value: "12"
      - key: AUCTION_SECOND_CHANCE_HOURS
        value: "24"
      - key: GOOGLE_WALLET_ISSUER_ID
        sync: false
      - key: GOOGLE_WALLET_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APPLE_PASS_TYPE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_PASS_CERT_P12
        sync: false
      - key: APPLE_PASS_CERT_PASSWORD
        sync: false
      - key: APPLE_WWDR_CERT
        sync: false
      # Convelio shipping. Off until the app with the new checkout ships; the sandbox
      # (sk_test_) key is right for staging.
      - key: CONVELIO_ENABLED
        value: "false"
      - key: CONVELIO_API_KEY
        sync: false
      - key: SHIPPING_QUOTE_VALID_HOURS
        value: "24"
      - key: SHIPPING_INSURANCE_DEFAULT
        value: "true"
      - key: ORDER_AUTO_COMPLETE_DAYS
        value: "7"

  - type: worker
    name: studio3-beat
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    # Exactly one instance. Never scale this service.
    startCommand: "celery -A src.jobs.celery_app.celery_app beat --loglevel=info"
    envVars:
      - key: FLASK_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_CURRENCY
        value: usd
      - key: PLATFORM_COMMISSION_BPS
        value: "2000"
      - key: SENTRY_DSN
        sync: false
