{% extends "admin/layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel" style="max-width: 380px; margin: 60px auto;">
  <h1>Studiothree Ops</h1>
  {% if error %}
    <p style="color: var(--danger); margin-top: 0;">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('admin.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>
      <label for="email">Email</label><br>
      <input id="email" name="email" type="email" autocomplete="username"
             required style="width: 100%; padding: 8px;">
    </p>
    <p>
      <label for="password">Password</label><br>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required style="width: 100%; padding: 8px;">
    </p>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted" style="margin-bottom: 0; font-size: 12px;">
    Admin access is granted with <span class="mono">scripts/promote_admin.py</span>.
  </p>
</div>
{% endblock %}
